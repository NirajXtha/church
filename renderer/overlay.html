<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans Devanagari",
          sans-serif;
        -webkit-app-region: drag;
      }
      #overlay-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 28px;
        color: #fff;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
        font-size: 20px;
        line-height: 1.5;
        text-align: center;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(6px);
        border-radius: 10px;
      }
      .overlay-verse-text {
        margin-bottom: 4px;
      }
      .overlay-verse-ref {
        font-size: 0.72em;
        opacity: 0.7;
        font-style: italic;
        letter-spacing: 0.5px;
      }
      .overlay-hidden {
        display: none;
      }
      .pos-top {
        align-items: flex-start;
        padding-top: 8px;
      }
      .pos-bottom {
        align-items: flex-end;
        padding-bottom: 8px;
      }
      .pos-center {
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="overlay-content">
      <div id="overlay-inner" class="overlay-hidden">
        <div class="overlay-verse-text" id="overlay-text"></div>
        <div class="overlay-verse-ref" id="overlay-ref"></div>
      </div>
    </div>
    <script>
      const content = document.getElementById("overlay-content");
      const inner = document.getElementById("overlay-inner");
      const textEl = document.getElementById("overlay-text");
      const refEl = document.getElementById("overlay-ref");

      window.api.onOverlayUpdate((data) => {
        if (data.text) {
          textEl.textContent = data.text;
          refEl.textContent = data.reference || "";
          inner.classList.remove("overlay-hidden");
        } else {
          inner.classList.add("overlay-hidden");
        }
        if (data.position) {
          content.className = "pos-" + data.position;
        }
        if (data.fontSize) {
          content.style.fontSize = data.fontSize + "px";
        }
      });
    </script>
  </body>
</html>
